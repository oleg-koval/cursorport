<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">cursorport — migrate Cursor → VS Code</title>
  <desc id="sc-desc">Social preview card for cursorport: shows project name, tagline, and terminal migration output</desc>
  <defs>
    <!-- subtle scanline pattern -->
    <pattern id="scan" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" y="2" fill="#000" opacity="0.18"/>
    </pattern>
    <!-- subtle dot grid -->
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#0f2010" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backgrounds -->
  <rect width="1200" height="630" fill="#000"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- logo (inline — cursor bar + arrow) -->
  <g transform="translate(1052, 32)">
    <rect width="108" height="108" rx="20" fill="#0d1117"/>
    <rect x="8" y="8" width="92" height="92" rx="16" fill="#060d06"/>
    <rect x="20" y="28" width="9" height="52" rx="2" fill="#00ff41" opacity="0.95"/>
    <path d="M 34,46 L 66,46 L 66,32 L 90,54 L 66,76 L 66,62 L 34,62 Z" fill="#00ff41" opacity="0.95"/>
  </g>

  <!-- project name -->
  <text x="64" y="112" font-family="'Courier New', Courier, monospace" font-size="86" font-weight="bold"
        fill="#ffffff" filter="url(#glow)">cursorport</text>

  <!-- tagline -->
  <text x="64" y="156" font-family="'Courier New', Courier, monospace" font-size="28"
        fill="#00ff41">migrate Cursor → VS Code in one command</text>

  <!-- terminal box -->
  <rect x="64" y="186" width="1072" height="358" rx="8" fill="#0a0a0a" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- terminal top bar -->
  <rect x="64" y="186" width="1072" height="36" rx="8" fill="#0d1a0d"/>
  <rect x="64" y="204" width="1072" height="18" fill="#0d1a0d"/>
  <text x="88" y="210" font-family="'Courier New', Courier, monospace" font-size="14" fill="#00c020" opacity="0.8">terminal</text>

  <!-- command line -->
  <text x="88" y="264" font-family="'Courier New', Courier, monospace" font-size="22" fill="#00ff41" filter="url(#glow)">$ npx cursorport</text>

  <!-- output lines — checkmarks -->
  <text x="88" y="302" font-family="'Courier New', Courier, monospace" font-size="21" fill="#00c020">  ✓</text>
  <text x="136" y="302" font-family="'Courier New', Courier, monospace" font-size="21" fill="#aaaaaa">  settings.json</text>
  <text x="480" y="302" font-family="'Courier New', Courier, monospace" font-size="21" fill="#444">cursor.* keys stripped</text>

  <text x="88" y="330" font-family="'Courier New', Courier, monospace" font-size="21" fill="#00c020">  ✓</text>
  <text x="136" y="330" font-family="'Courier New', Courier, monospace" font-size="21" fill="#aaaaaa">  keybindings.json</text>

  <text x="88" y="358" font-family="'Courier New', Courier, monospace" font-size="21" fill="#00c020">  ✓</text>
  <text x="136" y="358" font-family="'Courier New', Courier, monospace" font-size="21" fill="#aaaaaa">  snippets/</text>
  <text x="400" y="358" font-family="'Courier New', Courier, monospace" font-size="21" fill="#444">(14 files)</text>

  <text x="88" y="386" font-family="'Courier New', Courier, monospace" font-size="21" fill="#00c020">  ✓</text>
  <text x="136" y="386" font-family="'Courier New', Courier, monospace" font-size="21" fill="#aaaaaa">  extensions</text>
  <text x="400" y="386" font-family="'Courier New', Courier, monospace" font-size="21" fill="#444">(38 installed)</text>

  <!-- completion message -->
  <text x="88" y="432" font-family="'Courier New', Courier, monospace" font-size="22" fill="#00ff41" filter="url(#glow)">  Migration complete.</text>
  <text x="88" y="462" font-family="'Courier New', Courier, monospace" font-size="18" fill="#333">  Backup saved: ~/.cursorport_backup_2025-05-05T08-30-00</text>

  <!-- bottom bar inside terminal -->
  <line x1="64" y1="508" x2="1136" y2="508" stroke="#0f2010" stroke-width="1"/>
  <text x="88" y="528" font-family="'Courier New', Courier, monospace" font-size="18" fill="#00c020" opacity="0.6">$ npx cursorport</text>
  <text x="900" y="528" font-family="'Courier New', Courier, monospace" font-size="18" fill="#333">github.com/oleg-koval/cursorport</text>

  <!-- footer -->
  <text x="600" y="600" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="18"
        fill="#006010">MIT · Node.js ≥ 20 · macOS · Linux · Windows</text>
</svg>
