name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'logo.svg'
      - 'social-card.svg'
      - 'social-card.png'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Copy assets into docs/
        run: |
          cp logo.svg docs/logo.svg
          if [ -f social-card.png ]; then cp social-card.png docs/social-card.png; fi

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deploy
        uses: actions/deploy-pages@v4
